name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap and Build tools
        run: |
          npm install -g @bubblewrap/cli
          npm install

      - name: Build Web App
        run: npm run build --if-present

      - name: Initialize Bubblewrap
        run: |
          npx bubblewrap init --manifest=https://hanigh99.github.io/-My-money/manifest.webmanifest --skip-validation || true

      - name: Build APK File
        run: |
          npx bubblewrap build || true

      - name: Find and Package APK
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output_apk/*.apk
